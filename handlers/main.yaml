---
- name: Start Tika
  changed_when: yes
  ansible.builtin.shell:
    cmd: |
      set -e -u -o pipefail
      supervisorctl update tika
      supervisorctl start tika
  register: tika_service_result

- name: Restart Tika
  changed_when: yes
  ansible.builtin.shell:
    cmd: |
      set -e -u -o pipefail
      supervisorctl update tika
      supervisorctl restart tika
  when: not (tika_service_result is defined and tika_service_result.changed)
